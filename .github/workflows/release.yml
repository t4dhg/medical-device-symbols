name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      manifest-sha256: ${{ steps.bind.outputs.manifest-sha256 }}
      verifier-sha256: ${{ steps.bind.outputs.verifier-sha256 }}
      commit: ${{ steps.preflight.outputs.commit }}
      tag: ${{ steps.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Bind the annotated tag to fresh master
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release.mjs preflight > "$RUNNER_TEMP/release-preflight.json"
          node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${value.commit}\ntag=${value.tag}\n`);' "$RUNNER_TEMP/release-preflight.json"
      - name: Install the pinned publication client
        run: |
          npm install --global npm@11.19.0 --ignore-scripts --registry https://registry.npmjs.org
          test "$(npm --version)" = "11.19.0"
      - name: Install reviewed dependencies
        run: npm ci --ignore-scripts
      - name: Run the complete quality gate
        run: npm run verify
      - name: Pack and verify the release archive
        id: pack
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.preflight.outputs.commit }}
          RELEASE_TAG: ${{ steps.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/pack"
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/pack" > "$RUNNER_TEMP/pack-report.json"
          tarball_name="$(node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!Array.isArray(value) || value.length !== 1 || typeof value[0].filename !== "string") process.exit(1); process.stdout.write(value[0].filename);' "$RUNNER_TEMP/pack-report.json")"
          tarball="$RUNNER_TEMP/pack/$tarball_name"
          node scripts/test-package.mjs --tarball "$tarball"
          node scripts/check-release.mjs prepare --repository "$GITHUB_WORKSPACE" --bundle "$RUNNER_TEMP/release-bundle" --pack-report "$RUNNER_TEMP/pack-report.json" --tarball "$tarball" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - name: Bind independent release-file hashes
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          manifest_hash="$(sha256sum "$RUNNER_TEMP/release-bundle/release-manifest.json" | cut -d ' ' -f 1)"
          verifier_hash="$(sha256sum "$RUNNER_TEMP/release-bundle/check-release.mjs" | cut -d ' ' -f 1)"
          printf 'manifest-sha256=%s\nverifier-sha256=%s\n' "$manifest_hash" "$verifier_hash" >> "$GITHUB_OUTPUT"
      - name: Upload the reviewed release bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: medical-device-symbols-release-${{ steps.preflight.outputs.tag }}
          path: ${{ runner.temp }}/release-bundle
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      id-token: write
    concurrency:
      group: medical-device-symbols-npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download the reviewed bundle by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/release-bundle
          merge-multiple: true
          digest-mismatch: error
      - name: Bind and validate the downloaded bundle
        shell: bash
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.prepare.outputs.artifact-digest }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest-sha256 }}
          EXPECTED_VERIFIER_SHA256: ${{ needs.prepare.outputs.verifier-sha256 }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          case "$EXPECTED_ARTIFACT_DIGEST" in
            ""|*[!0-9a-f]*) exit 1 ;;
          esac
          test "${#EXPECTED_ARTIFACT_DIGEST}" -eq 64 || exit 1
          test "$(sha256sum "$RUNNER_TEMP/release-bundle/release-manifest.json" | cut -d ' ' -f 1)" = "$EXPECTED_MANIFEST_SHA256"
          test "$(sha256sum "$RUNNER_TEMP/release-bundle/check-release.mjs" | cut -d ' ' -f 1)" = "$EXPECTED_VERIFIER_SHA256"
          node "$RUNNER_TEMP/release-bundle/check-release.mjs" validate-bundle --bundle "$RUNNER_TEMP/release-bundle" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - name: Install the pinned publication client
        run: |
          npm install --global npm@11.19.0 --ignore-scripts --registry https://registry.npmjs.org
          test "$(npm --version)" = "11.19.0"
      - name: Classify the exact registry version
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          state_json="$(node "$RUNNER_TEMP/release-bundle/check-release.mjs" registry-state --bundle "$RUNNER_TEMP/release-bundle")"
          state="$(node -e 'const value = JSON.parse(process.argv[1]); if (!["missing", "existing"].includes(value.state)) process.exit(1); process.stdout.write(value.state);' "$state_json")"
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"
      - name: Publish the exact reviewed archive
        id: publish
        if: ${{ steps.registry.outputs.state == 'missing' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          env -u NODE_AUTH_TOKEN -u NPM_TOKEN -u GH_TOKEN -u GITHUB_TOKEN npm publish "$RUNNER_TEMP/release-bundle/medical-device-symbols-$version.tgz" --ignore-scripts --access public --tag latest --provenance --registry https://registry.npmjs.org
      - name: Prove registry bytes, signatures, and provenance
        id: verify-registry
        if: ${{ success() }}
        run: node "$RUNNER_TEMP/release-bundle/check-release.mjs" verify-registry --bundle "$RUNNER_TEMP/release-bundle"

  github-release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify the annotated tag and create or recover the release
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          tag_ref="$(env -u NODE_AUTH_TOKEN -u NPM_TOKEN -u GITHUB_TOKEN gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          tag_object="$(node -e 'const value = JSON.parse(process.argv[1]); if (value.object?.type !== "tag" || !/^[0-9a-f]{40}$/.test(value.object?.sha)) process.exit(1); process.stdout.write(value.object.sha);' "$tag_ref")"
          annotated_tag="$(env -u NODE_AUTH_TOKEN -u NPM_TOKEN -u GITHUB_TOKEN gh api --method GET "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
          node -e 'const value = JSON.parse(process.argv[1]); if (value.object?.type !== "commit" || value.object?.sha !== process.argv[2]) process.exit(1);' "$annotated_tag" "$RELEASE_COMMIT"

          response="$RUNNER_TEMP/release-response.txt"
          set +e
          env -u NODE_AUTH_TOKEN -u NPM_TOKEN -u GITHUB_TOKEN gh api --include --method GET "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$response"
          request_status=$?
          set -e
          http_status="$(node -e 'const fs = require("node:fs"); const text = fs.readFileSync(process.argv[1], "utf8"); const match = text.match(/^HTTP\/\S+ ([0-9]{3})[^\n]*\r?\n/); if (!match) process.exit(1); process.stdout.write(match[1]);' "$response")"
          if [ "$http_status" = 200 ] && [ "$request_status" -eq 0 ]; then
            :
          elif [ "$http_status" = 404 ] && [ "$request_status" -ne 0 ]; then
            set +e
            env -u NODE_AUTH_TOKEN -u NPM_TOKEN -u GITHUB_TOKEN gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
            create_status=$?
            set -e
            printf 'release create exit status: %s; verifying authoritative post-state\n' "$create_status"
          else
            printf 'indeterminate release lookup: HTTP %s, exit %s\n' "$http_status" "$request_status" >&2
            exit 1
          fi

          release="$(env -u NODE_AUTH_TOKEN -u NPM_TOKEN -u GITHUB_TOKEN gh api --method GET "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          node -e 'const value = JSON.parse(process.argv[1]); const tag = process.argv[2]; if (value.tag_name !== tag || value.name !== tag || value.draft !== false || value.prerelease !== false) process.exit(1);' "$release" "$RELEASE_TAG"
